<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Digital Literacy Training Platform</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden;}
  .floating-shapes{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .shape{position:absolute;background:rgba(255,255,255,0.1);border-radius:50%;animation:float 6s ease-in-out infinite;}
  .shape:nth-child(1){width:80px;height:80px;top:20%;left:10%;animation-delay:0s;}
  .shape:nth-child(2){width:120px;height:120px;top:60%;right:15%;animation-delay:2s;}
  .shape:nth-child(3){width:60px;height:60px;top:80%;left:20%;animation-delay:4s;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(180deg);}}
  .container{background:rgba(255,255,255,0.95);backdrop-filter:blur(15px);border-radius:25px;padding:40px;width:100%;max-width:450px;position:relative;z-index:2;border:1px solid rgba(255,255,255,0.2);animation:slideUp 0.6s ease-out;}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .header{text-align:center;margin-bottom:30px;}
  .logo{width:80px;height:80px;border-radius:50%;margin:0 auto 20px;display:block;border:3px solid rgba(102,126,234,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.2);}
  .title{font-size:2.2rem;font-weight:800;color:#2c3e50;margin-bottom:10px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .subtitle{color:#764ba2;font-size:1.1rem;font-weight:500;}
  .form-group{margin-bottom:25px;}
  .form-group label{display:block;margin-bottom:8px;color:#2c3e50;font-weight:600;font-size:1rem;}
  .form-group input{width:100%;padding:15px 20px;border:2px solid #e1e8ed;border-radius:15px;font-size:1rem;transition:all 0.3s ease;background:rgba(255,255,255,0.9);outline:none;}
  .form-group input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);transform:translateY(-2px);}
  .submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:15px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 20px rgba(102,126,234,0.3);margin-bottom:20px;}
  .submit-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 25px rgba(102,126,234,0.4);}
  .submit-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;}
  .message{padding:12px 16px;border-radius:10px;margin-bottom:20px;text-align:center;font-weight:600;display:none;}
  .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;display:block;}
  .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;display:block;}
  .login-link{display:block;text-align:center;color:#764ba2;text-decoration:none;font-weight:600;transition:all 0.3s ease;padding:10px;border-radius:10px;}
  .login-link:hover{color:#667eea;background:rgba(102,126,234,0.1);transform:translateY(-2px);}
  .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite;margin-right:10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="floating-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="container">
  <div class="header">
    <img src="DLTP logo.jpg" alt="DLTP Logo" class="logo">
    <h1 class="title">Create Account<br><span style='font-size:1.1rem;font-weight:normal;color:#764ba2;'>ఖాతాను సృష్టించండి</span></h1>
    <p class="subtitle">Join Digital Literacy Training Platform<br><span style='font-size:1rem;font-weight:normal;color:#764ba2;'>డిజిటల్ లిటరసీ ట్రైనింగ్ ప్లాట్‌ఫారమ్‌లో చేరండి</span></p>
  </div>

  <div id="message" class="message"></div>

  <form id="registerForm">
    <div class="form-group">
      <label for="username">Username<br><span style='font-size:0.95rem;font-weight:normal;color:#764ba2;'>వినియోగదారు పేరు</span></label>
      <input type="text" id="username" name="username" placeholder="Enter your username | మీ వినియోగదారు పేరును నమోదు చేయండి" required autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Password<br><span style='font-size:0.95rem;font-weight:normal;color:#764ba2;'>పాస్వర్డ్</span></label>
      <input type="password" id="password" name="password" placeholder="Enter your password | మీ పాస్వర్డ్‌ను నమోదు చేయండి" required minlength="6" autocomplete="new-password">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Create Account<br><span style='font-size:1rem;font-weight:normal;'>ఖాతాను సృష్టించండి</span></button>
  </form>

  <a href="login.html" class="login-link">Already have an account? Login here<br><span style='font-size:0.95rem;font-weight:normal;color:#764ba2;'>ఇప్పటికే ఖాతా ఉందా? ఇక్కడ లాగిన్ చేయండి</span></a>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const messageDiv = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');

  messageDiv.style.display='none';

  if(!username || !password){ 
    messageDiv.innerHTML='Please fill in all fields.<br><span style="color:#764ba2;font-weight:normal;">దయచేసి అన్ని ఫీల్డ్స్‌ను పూరించండి.</span>'; 
    messageDiv.className='message error'; messageDiv.style.display='block'; 
    return;
  }
  if(password.length<6){
    messageDiv.innerHTML='Password must be at least 6 characters.<br><span style="color:#764ba2;font-weight:normal;">పాస్వర్డ్ కనీసం 6 అక్షరాల పొడవులో ఉండాలి.</span>'; 
    messageDiv.className='message error'; messageDiv.style.display='block'; 
    return;
  }

  // Disable button
  submitBtn.disabled=true;
  submitBtn.innerHTML='<span class="spinner"></span>Creating Account...<br><span style="font-size:1rem;font-weight:normal;">ఖాతాను సృష్టిస్తోంది...</span>';

  // Save in localStorage
  localStorage.setItem('DLTP_username', username);
  localStorage.setItem('DLTP_password', password);

  messageDiv.innerHTML='✅ Account created successfully! Redirecting to login...<br><span style="color:#764ba2;font-weight:normal;">ఖాతా విజయవంతంగా సృష్టించబడింది! లాగిన్‌కు రీడైరెక్ట్ అవుతోంది...</span>';
  messageDiv.className='message success';
  messageDiv.style.display='block';

  setTimeout(()=>{ window.location.href='login.html'; },2000);
});
</script>
</body>
</html>
